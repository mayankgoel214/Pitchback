name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitchback
          POSTGRES_PASSWORD: pitchback
          POSTGRES_DB: pitchback
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway local container, not a secret. The integration tests run
      # against a real Postgres on purpose: an in-memory double cannot
      # reproduce a JSON column that fails to round-trip.
      DATABASE_URL: postgresql://pitchback:pitchback@localhost:55432/pitchback

    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the lockfile was generated with. npm 10 and
      # npm 11 disagree about esbuild's optional platform packages, and the
      # mismatch shows up only as `npm ci` claiming they are missing.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npx next build

  voice-loop:
    # Covers the call loop end to end against a stubbed model, so it costs
    # nothing at OpenAI. Note that GitHub's runners have no audio input
    # device — a pulseaudio null sink was tried and does not provide one —
    # so the test skips the microphone assertions here and says so loudly in
    # its output. MediaRecorder and the transcription upload are verified
    # locally, where a device exists. See tests/e2e/voice-loop.mjs.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitchback
          POSTGRES_PASSWORD: pitchback
          POSTGRES_DB: pitchback
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pitchback:pitchback@localhost:55432/pitchback
      OPENAI_API_KEY: stub-not-real
      OPENAI_BASE_URL: http://localhost:4599/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx prisma migrate deploy

      - run: npx next build

      - name: Start the stub model
        run: node tests/e2e/stub-model.mjs &

      - name: Start the app
        run: |
          npx next start -p 3111 &
          npx wait-on http://localhost:3111 --timeout 60000

      - name: Voice loop
        run: npm run test:e2e -- http://localhost:3111
